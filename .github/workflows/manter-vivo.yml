# O GitHub desliga agendamento de repositório sem atividade por 60 dias; este commit mensal evita isso.
name: manter-vivo
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > vivo.txt
          git config user.name "vigia"; git config user.email "vigia@users.noreply.github.com"
          git add vivo.txt; git commit -m "manter vivo" && git push
